<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Schmid" />
  <meta name="theme-color" content="#f3eee6" />
  <title>Schmid · Speisekarte · Café Pfaffenhausen</title>
  <style>
    @font-face {
      font-family: "Wix Madefor Display";
      src: url("fonts/wix-display.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Wix Madefor Text";
      src: url("fonts/wix-text-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Wix Madefor Text";
      src: url("fonts/wix-text-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Wix Madefor Text";
      src: url("fonts/wix-text-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #f3eee6;
      --ink: #211c17;
      --muted: #6e655c;
      --faint: #8d847a;
      --line: #ddd4c6;
      --accent: #7a332e;
      --serif: "Wix Madefor Display", ui-sans-serif, system-ui, sans-serif;
      --sans: "Wix Madefor Text", ui-sans-serif, system-ui, sans-serif;
      --bar-paper: oklch(18% 0.018 55);
      --bar-ink: oklch(95% 0.012 85);
      --bar-muted: oklch(74% 0.018 75);
      --bar-rule: oklch(34% 0.018 60);
      --bar-accent: oklch(78% 0.11 72);
      --bar-accent-ink: oklch(22% 0.03 55);
      --tone-gold: oklch(82% 0.12 92);
      --tone-amber: oklch(72% 0.13 68);
      --tone-lemon: oklch(86% 0.14 102);
      --tone-orange: oklch(70% 0.16 48);
      --tone-leaf: oklch(74% 0.1 145);
      --tone-pale: oklch(88% 0.04 95);
      --tone-garnet: oklch(55% 0.14 25);
      --tone-copper: oklch(66% 0.11 55);
      --tone-cream: oklch(86% 0.04 85);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      overscroll-behavior: none;
      background: #241f1c;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.4;
      user-select: none;
    }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    img { display: block; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .device {
      width: min(1180px, calc(100vw - 48px));
      height: min(800px, calc(100dvh - 48px));
      background: var(--bg);
      border: 8px solid #1c1816;
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.38);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px 12px 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      position: relative;
      height: 52px;
      margin: 0 0 0 42px;
    }
    h1 .word { height: 52px; width: auto; }
    h1 .aehre {
      position: absolute;
      height: 46px;
      width: auto;
      left: -36px;
      top: 12px;
    }
    .head-meta { display: flex; align-items: center; gap: 14px; }
    time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
    .ticket {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px 6px;
      background: #fff;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .stage {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 308px;
      min-height: 0;
    }
    .rail {
      background: #ebe4d8;
      padding: 14px 10px;
      overflow: auto;
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .rail .kicker { margin: 2px 10px 8px; }
    .rail button {
      display: block;
      width: 100%;
      text-align: left;
      min-height: 44px;
      padding: 11px 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.25;
    }
    .rail button[aria-current="true"] {
      color: var(--ink);
      background: #fff;
    }
    #menu {
      position: relative;
      overflow: auto;
      padding: 20px 26px 28px;
      scrollbar-color: #cfc4b4 transparent;
      -webkit-overflow-scrolling: touch;
    }
    .section { margin-top: 28px; scroll-margin-top: 12px; }
    .section:first-child { margin-top: 0; }
    .section h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .section h2.subhead { margin-top: 28px; }
    .lead { margin-top: 3px; color: var(--muted); font-size: 14px; }
    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 14px;
    }
    .feature {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .feature img { width: 100%; height: 148px; object-fit: cover; border-radius: 14px; background: #e6ddcf; }
    .feature:disabled img { opacity: 0.55; }
    .fn {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-top: 8px;
    }
    .ft { font-family: var(--serif); font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
    .fp { font-variant-numeric: tabular-nums; font-size: 14px; }
    .feature:disabled .fp {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .fd { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
    .rows { margin-top: 6px; }
    .item {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      padding: 12px 4px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }
    .rows .item:first-child { border-top: 1px solid var(--line); margin-top: 8px; }
    .item:not(:disabled):hover { background: rgba(33, 28, 23, 0.035); }
    .thumb { width: 72px; height: 72px; overflow: hidden; border-radius: 12px; background: #e6ddcf; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item:disabled .thumb img { opacity: 0.45; }
    .mono {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      font-family: var(--serif);
      font-size: 28px;
      color: #6d6256;
    }
    .name {
      display: block;
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .desc { display: block; margin-top: 2px; color: var(--muted); font-size: 13.5px; }
    .desc.short {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }
    .when { display: block; margin-top: 6px; color: var(--accent); font-size: 13px; }
    .marks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .marks span {
      padding: 2px 7px;
      border-radius: 999px;
      background: #e7dfd2;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.4;
    }
    .price { font-variant-numeric: tabular-nums; font-size: 15px; padding-top: 3px; }
    .item:disabled { color: var(--ink); }
    .houses {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 14px;
    }
    .houses h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; }
    .houses p { margin-top: 2px; color: var(--muted); font-size: 13.5px; }
    .hours { list-style: none; margin: 10px 0 0; padding: 0; }
    .hours li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .hours li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
    .key {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 22px;
      margin: 12px 0 0;
    }
    .key div {
      display: grid;
      grid-template-columns: 1.6rem 1fr;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }
    .key dt { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
    .key dd { margin: 0; }
    aside {
      min-height: 0;
      display: flex;
      padding: 16px 16px 16px 0;
    }
    #slip {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 16px 14px;
      background: #fff;
      border-radius: 20px;
    }
    .slip-body { flex: 1; min-height: 0; overflow: auto; }
    .slip-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 28px;
      letter-spacing: -0.03em;
      margin: 4px 0 12px;
    }
    .how { list-style: none; margin: 8px 0 0; padding: 0; }
    .how li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }
    .how span { font-family: var(--serif); color: var(--accent); font-size: 18px; line-height: 1.2; }
    .how-note { margin-top: 14px; color: var(--muted); font-size: 14px; }
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .ln { display: block; font-family: var(--serif); font-size: 16px; font-weight: 500; }
    .ld { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
    .lp { font-variant-numeric: tabular-nums; font-size: 14px; padding-top: 4px; }
    .stepper {
      display: inline-grid;
      grid-template-columns: 36px 22px 36px;
      align-items: center;
      justify-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .stepper button {
      width: 36px;
      height: 40px;
      border: 0;
      background: transparent;
      font-size: 18px;
      line-height: 1;
    }
    .total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--ink);
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
    }
    .slip-foot { padding-top: 12px; }
    .send {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #f4efe7;
      font-size: 15px;
      font-weight: 500;
    }
    .send:disabled { background: #d9d0c3; color: #8c8378; }
    .fine { margin-top: 8px; text-align: center; color: var(--muted); font-size: 12px; }
    .order-no {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 72px;
      line-height: 0.85;
      letter-spacing: -0.045em;
      margin: 12px 0 8px;
    }
    .where { color: var(--muted); font-size: 14px; }
    .bring { margin-top: 14px; font-size: 14.5px; }
    .q { font-variant-numeric: tabular-nums; padding-top: 3px; color: var(--muted); }
    #sheet {
      border: 0;
      border-radius: 20px;
      padding: 0;
      color: var(--ink);
      background: #f6f1e8;
      width: min(760px, calc(100vw - 72px));
      max-height: calc(100dvh - 72px);
    }
    #sheet::backdrop { background: rgba(20, 16, 13, 0.5); }
    .sheet { display: grid; min-height: 420px; }
    .sheet.has-photo { grid-template-columns: 268px minmax(0, 1fr); }
    .sheet-photo { position: relative; background: #e6ddcf; min-height: 240px; }
    .sheet-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .sheet-photo img.line { object-fit: contain; }
    .sheet-copy { padding: 20px 22px 18px; overflow: auto; max-height: calc(100dvh - 72px); }
    .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .sheet-top h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 32px;
      letter-spacing: -0.03em;
    }
    .sheet-top button {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 44px;
      padding: 0 2px;
    }
    .sheet-copy > .desc { margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    fieldset { border: 0; margin: 14px 0 0; padding: 0; }
    legend {
      padding: 0;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #cfc4b4;
      background: transparent;
    }
    .choices button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #f4efe7;
    }
    .sheet-actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
    .sheet-actions .stepper { grid-template-columns: 42px 28px 42px; }
    .sheet-actions .stepper button { width: 42px; height: 48px; }
    .add {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #f4efe7;
      font-weight: 500;
    }
    .turn { display: none; }
    @media (any-pointer: coarse) and (max-width: 1400px) and (orientation: landscape) {
      body { background: var(--bg); }
      .device {
        width: 100%;
        height: 100%;
        height: 100svh;
        border: 0;
        border-radius: 0;
      }
      header {
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(18px, env(safe-area-inset-right));
      }
      .slip-foot { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }
    @media (any-pointer: coarse) and (orientation: portrait) {
      .turn {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 30;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #241f1c;
        color: #f3eee6;
        text-align: center;
      }
      .turn p {
        font-family: var(--serif);
        font-size: 32px;
        letter-spacing: -0.03em;
      }
    }
    .to-map {
      margin-top: 12px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    #menu.is-map { padding: 0; background: var(--bg); }
    .bar-map {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100%;
      padding: 14px 16px 12px;
      background: var(--bg);
      color: var(--ink);
    }
    .bar-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .bar-top h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    .bar-top p { margin-top: 2px; color: var(--muted); font-size: 13px; }
    .bar-list {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
    }
    .bar-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .bar-filters button {
      min-height: 40px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }
    .bar-filters button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }
    .field {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 40px;
      grid-template-rows: 18px minmax(0, 1fr) 18px;
      grid-template-areas:
        ". north ."
        "west plot east"
        ". south .";
      gap: 6px 8px;
      min-height: 0;
      margin-top: 8px;
    }
    .plot {
      grid-area: plot;
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }
    .plot::before, .plot::after {
      content: "";
      position: absolute;
      background: var(--line);
      pointer-events: none;
    }
    .plot::before { left: 50%; top: 18px; bottom: 18px; width: 1px; }
    .plot::after { top: 50%; left: 36px; right: 36px; height: 1px; }
    .ax {
      color: var(--faint);
      font-size: 11px;
      line-height: 1;
      pointer-events: none;
    }
    .ax-t { grid-area: north; justify-self: center; align-self: end; }
    .ax-b { grid-area: south; justify-self: center; align-self: start; }
    .ax-l { grid-area: west; justify-self: end; align-self: center; }
    .ax-r { grid-area: east; justify-self: start; align-self: center; }
    .glass {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 64px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      opacity: 1;
      transition: opacity 160ms ease;
    }
    .glass.is-dim { opacity: 0.16; }
    .glass svg { display: block; width: 22px; height: 32px; margin: 0 auto; overflow: visible; }
    .glass .glassbody { fill: #f6f1e8; }
    .glass .liquid { fill: currentColor; }
    .glass .foam { fill: #fffdf8; stroke: var(--ink); stroke-width: 0.45; }
    .glass .bubble { stroke: var(--ink); stroke-width: 0.3; }
    .glass .rim { fill: none; stroke: var(--ink); stroke-width: 1.15; stroke-linejoin: round; stroke-linecap: round; }
    .glass .bubble, .glass .sheen { fill: #fff; }
    .glass .slice { fill: var(--tone-orange); stroke: var(--ink); stroke-width: 0.35; }
    .glass .bubble, .glass .foam, .glass .sheen { transform-box: fill-box; transform-origin: center; }
    .glass .bubble { animation: rise 2.8s ease-in infinite; }
    .glass .b2 { animation-duration: 3.3s; animation-delay: -1.1s; }
    .glass .b3 { animation-duration: 2.4s; animation-delay: -1.7s; }
    .glass .b4 { animation-duration: 3.6s; animation-delay: -0.6s; }
    .glass .foam { animation: head 2.6s ease-in-out infinite; }
    .glass .sheen { animation: glint 3.6s ease-in-out infinite; }
    .glass .gname {
      display: block;
      margin-top: 1px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }
    .glass:hover .gname, .glass:focus-visible .gname { color: var(--ink); }
    @keyframes rise {
      0% { transform: translateY(5px); opacity: 0; }
      22% { opacity: 0.9; }
      100% { transform: translateY(-13px); opacity: 0; }
    }
    @keyframes head {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.7px); }
    }
    @keyframes glint {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.75; }
    }
    .tone-gold { color: var(--tone-gold); }
    .tone-amber { color: var(--tone-amber); }
    .tone-lemon { color: var(--tone-lemon); }
    .tone-orange { color: var(--tone-orange); }
    .tone-leaf { color: var(--tone-leaf); }
    .tone-pale { color: var(--tone-pale); }
    .tone-garnet { color: var(--tone-garnet); }
    .tone-copper { color: var(--tone-copper); }
    .tone-cream { color: var(--tone-cream); }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .glass { transition: none; }
      .glass .bubble, .glass .foam, .glass .sheen { animation: none; }
    }
  </style>
</head>
<body>
  <div class="turn"><p>Zum Vorstellen quer halten.</p></div>
  <div class="device">
    <header>
      <h1>
        <img class="aehre" src="bilder/logo-aehre.png" alt="" />
        <img class="word" src="bilder/logo-black.png" alt="Schmid, Bäckerei Konditorei Café seit 1909" />

      const day = now.toLocaleDateString("de-DE", { weekday: "short" });
      const time = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("clock").textContent = `${day} ${time}`;
    }

    function defaults(item) {
      return item.option === "koffein" ? { koffein: "mit" } : {};
    }

    function extra(item, selected) {
      if (item.option !== "koffein") return { note: "", codes: item.codes || [] };
      const decaf = selected.koffein === "ohne";
      const codes = decaf ? (item.codes || []).filter((code) => code !== 9) : [...new Set([...(item.codes || []), 9])];
      return { note: decaf ? "entkoffeiniert" : "", codes };
    }

    function lineView(line) {
      const item = itemById(line.id);
      const picked = extra(item, line.selected);
      return {
        name: item.name,
        note: picked.note,
        qty: line.qty,
        amount: item.price * line.qty,
      };
    }

    function thumb(item) {
      if (item.image) return `<img src="${item.image}" alt="" />`;
      return `<span class="mono" aria-hidden="true">${esc(item.name.replace(/^[„"]/, "").slice(0, 1))}</span>`;
    }

    function marks(codes) {
      if (!codes || !codes.length) return "";
      return `<span class="marks">${codes.map((code) => `<span>${code} ${esc(SHORT[code] || ADD[code])}</span>`).join("")}</span>`;
    }

    function blurb(item) {
      if (item.parts && item.parts.length) {
        const parts = item.cat === "fruehstueck"
          ? item.parts.map((part) => part.replace(/^1 /, ""))
          : item.parts;
        return parts.join(", ");
      }
      return [item.size, item.hint].filter(Boolean).join(", ");
    }

    function featureCard(item) {
      return `<button type="button" class="feature" data-action="open" data-id="${item.id}">
        <img src="${item.image}" alt="" />
        <span class="fn">
          <span class="ft">${esc(item.name)}</span>
          <span class="fp">${euro(item.price)}</span>
        </span>
        ${item.caption ? `<span class="fd">${esc(item.caption)}</span>` : ""}
      </button>`;
    }

    function row(item) {
      const off = closedToday(item);
      return `<button type="button" class="item" data-action="open" data-id="${item.id}" ${off ? "disabled" : ""}>
        <span class="thumb">${thumb(item)}</span>
        <span>
          <span class="name">${esc(item.name)}</span>
          ${blurb(item) ? `<span class="desc short">${esc(blurb(item))}</span>` : ""}
          ${off ? `<span class="when">Nur Freitag und Samstag</span>` : ""}
        </span>
        <span class="price">${euro(item.price)}</span>
      </button>`;
    }

    function drinkOn(spot) {
      if (drinkFilter === "alles") return true;
      if (drinkFilter === "frei") return spot.label === "Frei";
      if (drinkFilter === "erfrischend") return spot.y < 45;
      if (drinkFilter === "gehaltvoll") return spot.y > 58;
      if (drinkFilter === "herb") return spot.x < 46;
      if (drinkFilter === "suess") return spot.x > 58;
      return true;
    }

    function renderMap() {
      menuEl.classList.add("is-map");
      const filters = [
        ["alles", "Alles"],
        ["erfrischend", "Erfrischend"],
        ["herb", "Herb"],
        ["suess", "Süß"],
        ["gehaltvoll", "Gehaltvoll"],
        ["frei", "Alkoholfrei"],
      ];
      const marks = Object.entries(spots).map(([id, spot]) => `
        <button type="button" class="glass${drinkOn(spot) ? "" : " is-dim"}" data-action="open" data-id="${id}" style="left:${spot.x}%;top:${spot.y}%">
          <span class="tone-${spot.tone}">${glassSvg[spot.glass]}</span>
          <span class="gname">${esc(spot.label)}</span>
        </button>`).join("");
      menuEl.innerHTML = `
        <div class="bar-map">
          <div class="bar-top">
            <div>
              <h2>Geschmackskarte</h2>
              <p>Herb oder süß, leicht oder gehaltvoll.</p>
            </div>
            <button type="button" class="bar-list" data-action="drink-view" data-view="liste">Liste</button>
          </div>
          <div class="bar-filters" role="group" aria-label="Geschmack">
            ${filters.map(([id, label]) => `<button type="button" data-action="filter" data-filter="${id}" aria-pressed="${drinkFilter === id}">${label}</button>`).join("")}
          </div>
          <div class="field">
            <span class="ax ax-t">erfrischend</span>
            <span class="ax ax-l">herb</span>
            <div class="plot">${marks}</div>
            <span class="ax ax-r">süß</span>
            <span class="ax ax-b">gehaltvoll</span>
          </div>
        </div>`;
      setCurrent("alkohol");
    }

    function renderMenu() {
      menuEl.classList.remove("is-map");
      const nav = [...categories, { id: "zeiten", label: "Öffnungszeiten" }];
      document.getElementById("cats").innerHTML = nav.map((cat) =>
        `<button type="button" data-action="nav" data-cat="${cat.id}">${esc(cat.label)}</button>`
      ).join("");
      const featured = items.filter((item) => item.feature).sort((a, b) => a.feature - b.feature);
      const key = Object.entries(ADD).map(([code, name]) => `<div><dt>${code}</dt><dd>${esc(name)}</dd></div>`).join("");
      menuEl.innerHTML = categories.map((cat) => {
        const cards = cat.id === "fruehstueck" ? featured.map(featureCard).join("") : "";
        const rows = items.filter((item) => item.cat === cat.id).map(row).join("");
        return `<section class="section" id="${cat.id}">
          <h2>${esc(cat.label)}</h2>
          ${cat.lead ? `<p class="lead">${esc(cat.lead)}</p>` : ""}
          ${cat.id === "alkohol" ? `<button type="button" class="to-map" data-action="drink-view" data-view="karte">Geschmackskarte</button>` : ""}
          ${cards ? `<div class="features">${cards}</div>` : ""}
          <div class="rows">${rows}</div>
        </section>`;
      }).join("") + `<section class="section" id="zeiten">
        <h2>Öffnungszeiten</h2>
        <div class="houses">
          <div>
            <h3>Café Pfaffenhausen</h3>
            <p>Hauptstraße 17<br>08265 7338860</p>
            <ul class="hours">
              <li><span>Montag bis Freitag</span><span>6:00 bis 17:30</span></li>
              <li><span>Samstag</span><span>6:00 bis 12:00</span></li>
              <li><span>Sonntag</span><span>geschlossen</span></li>
            </ul>
          </div>
          <div>
            <h3>Stammhaus Stetten</h3>
            <p>Hauptstraße 24<br>08261 9371</p>
            <ul class="hours">
              <li><span>Montag bis Freitag</span><span>6:00 bis 12:30, 14:00 bis 18:00</span></li>
              <li><span>Samstag</span><span>6:15 bis 12:00</span></li>
              <li><span>Sonntag</span><span>geschlossen</span></li>
            </ul>
          </div>
        </div>
        <h2 class="subhead">Zusatzstoffe</h2>
        <p class="lead">Die Zahl steht auf der Karte neben dem Gericht.</p>
        <dl class="key">${key}</dl>
      </section>`;
    }

    function setCurrent(id) {
      for (const button of document.querySelectorAll(".rail button")) {
        if (button.dataset.cat === id) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      }
    }

    function renderSheet() {
      const item = itemById(draft.id);
      const picked = extra(item, draft.selected);
      const koffein = item.option === "koffein" ? `
        <fieldset>
          <legend>Koffein</legend>
          <div class="choices">
            <button type="button" data-action="pick" data-group="koffein" data-choice="mit" aria-pressed="${draft.selected.koffein !== "ohne"}">Mit Koffein</button>
            <button type="button" data-action="pick" data-group="koffein" data-choice="ohne" aria-pressed="${draft.selected.koffein === "ohne"}">Entkoffeiniert</button>
          </div>
        </fieldset>` : "";
      sheet.innerHTML = `
        <div class="sheet ${item.image ? "has-photo" : ""}">
          ${item.image ? `<div class="sheet-photo"><img src="${item.image}" alt=""${item.id === "schmid" ? ' class="line"' : ""} /></div>` : ""}
          <div class="sheet-copy">
            <div class="sheet-top">
              <h2 id="sheet-title">${esc(item.name)}</h2>
              <button type="button" data-action="close">Schließen</button>
            </div>
            ${blurb(item) ? `<p class="desc">${esc(blurb(item))}</p>` : ""}
            ${item.days ? `<p class="when">Nur Freitag und Samstag</p>` : ""}
            ${marks(picked.codes)}
            ${koffein}
            <div class="sheet-actions">
              <div class="stepper">
                <button type="button" data-action="qty" data-dir="-1" aria-label="weniger">−</button>
                <span>${draft.qty}</span>
                <button type="button" data-action="qty" data-dir="1" aria-label="mehr">+</button>
              </div>
              <button type="button" class="add" data-action="add">Hinzufügen · ${euro(item.price * draft.qty)}</button>
            </div>
          </div>
        </div>`;
    }

    function lineHtml(line, withStepper) {
      const stepper = withStepper ? `
        <span class="stepper">
          <button type="button" data-action="dec" data-uid="${line.uid}" aria-label="weniger ${esc(line.name)}">−</button>
          <span>${line.qty}</span>
          <button type="button" data-action="inc" data-uid="${line.uid}" aria-label="mehr ${esc(line.name)}">+</button>
        </span>
      ` : `<span class="q">${line.qty}×</span>`;
      return `<li>
        ${stepper}
        <span>
          <span class="ln">${esc(line.name)}</span>
          ${line.note ? `<span class="ld">${esc(line.note)}</span>` : ""}
        </span>
        <span class="lp">${euro(line.amount)}</span>
      </li>`;
    }

    function renderSlip() {
      if (receipt) {
        slipEl.innerHTML = `
          <div class="slip-body">
            <p class="kicker">An der Theke</p>
            <h2 class="order-no">${receipt.no}</h2>
            <p class="where">Tisch 7 · zahlen Sie an der Kasse</p>
            <ul class="lines">${receipt.lines.map((line) => lineHtml(line, false)).join("")}</ul>
            <p class="total"><span>Summe</span><span>${euro(receipt.total)}</span></p>
            <p class="bring">Wir bringen es an den Tisch.</p>
          </div>
          <div class="slip-foot">
            <button type="button" class="send" data-action="reset">Neue Bestellung</button>
          </div>`;
        return;
      }
      const lines = cart.map((line) => ({ uid: line.uid, ...lineView(line) }));
      const total = lines.reduce((sum, line) => sum + line.amount, 0);
      const count = lines.reduce((sum, line) => sum + line.qty, 0);
      slipEl.innerHTML = `
        <div class="slip-body">
          <p class="kicker">Bestellung</p>
          <h2 class="slip-title">${count ? `${count} gewählt` : "Noch leer"}</h2>
          ${lines.length ? `
            <ul class="lines">${lines.map((line) => lineHtml(line, true)).join("")}</ul>
            <p class="total"><span>Summe</span><span>${euro(total)}</span></p>
          ` : `
            <ol class="how">
              <li><span>1</span>Gericht wählen</li>
              <li><span>2</span>An die Theke schicken</li>
              <li><span>3</span>An der Kasse zahlen</li>
            </ol>
            <p class="how-note">Wir bringen alles an Tisch 7.</p>
          `}
        </div>
        <div class="slip-foot">
          <button type="button" class="send" data-action="send" ${lines.length ? "" : "disabled"}>An die Theke schicken</button>
          <p class="fine">Bitte an der Kasse bezahlen.</p>
        </div>`;
    }

    function say(text) {
      live.textContent = "";
      live.textContent = text;
    }

    function openItem(id) {
      const item = itemById(id);
      if (!item || closedToday(item)) return;
      if (receipt) {
        receipt = null;
        renderSlip();
      }
      draft = { id, qty: 1, selected: defaults(item) };
      sheet.classList.toggle("bar", menuEl.classList.contains("is-map"));
      renderSheet();
      if (!sheet.open) sheet.showModal();
    }

    function addDraft() {
      const item = itemById(draft.id);
      cart.push({
        uid: `l${seq++}`,
        id: item.id,
        qty: draft.qty,
        selected: { ...draft.selected },
      });
      say(`${item.name} hinzugefügt`);
      draft = null;
      sheet.close();
      renderSlip();
    }

    function sendOrder() {
      if (!cart.length) return;
      const lines = cart.map(lineView);
      receipt = {
        no: nextNo++,
        lines,
        total: lines.reduce((sum, line) => sum + line.amount, 0),
      };
      cart = [];
      say(`Bestellung ${receipt.no} ist an der Theke`);
      renderSlip();
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "nav") {
        showCat(button.dataset.cat);
      } else if (action === "filter") {
        drinkFilter = button.dataset.filter;
        renderMap();
      } else if (action === "drink-view") {
        drinkView = button.dataset.view;
        if (drinkView === "karte") renderMap();
        else showCat("alkohol");
      } else if (action === "open") {
        openItem(button.dataset.id);
      } else if (action === "pick") {
        draft.selected[button.dataset.group] = button.dataset.choice;
        renderSheet();
      } else if (action === "qty") {
        draft.qty = Math.max(1, Math.min(9, draft.qty + Number(button.dataset.dir)));
        renderSheet();
      } else if (action === "add") {
        addDraft();
      } else if (action === "close") {
        sheet.close();
      } else if (action === "inc" || action === "dec") {
        const line = cart.find((entry) => entry.uid === button.dataset.uid);
        if (!line) return;
        line.qty += action === "inc" ? 1 : -1;
        if (line.qty <= 0) cart = cart.filter((entry) => entry.uid !== line.uid);
        else line.qty = Math.min(9, line.qty);
        renderSlip();
      } else if (action === "send") {
        sendOrder();
      } else if (action === "reset") {
        receipt = null;
        renderSlip();
      }
    });

    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) sheet.close();
    });
    sheet.addEventListener("close", () => { draft = null; });

    let navLock = false;

    function showCat(id) {
      currentCat = id;
      setCurrent(id);
      if (id === "alkohol" && drinkView === "karte") {
        renderMap();
        return;
      }
      if (menuEl.classList.contains("is-map")) renderMenu();
      const section = document.getElementById(id);
      if (!section) return;
      navLock = true;
      menuEl.scrollTop = section.offsetTop;
      requestAnimationFrame(() => { navLock = false; });
    }

    function catFromScroll() {
      const line = menuEl.scrollTop + 8;
      let id = "fruehstueck";
      for (const cat of [...categories, { id: "zeiten" }]) {
        const section = document.getElementById(cat.id);
        if (section && section.offsetTop <= line) id = cat.id;
      }
      return id;
    }

    menuEl.addEventListener("scroll", () => {
      if (navLock || menuEl.classList.contains("is-map")) return;
      const id = catFromScroll();
      currentCat = id;
      setCurrent(id);
    }, { passive: true });

    paintClock();
    renderMenu();
    renderSlip();
    setCurrent("fruehstueck");

    if ("serviceWorker" in navigator && window.isSecureContext) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
